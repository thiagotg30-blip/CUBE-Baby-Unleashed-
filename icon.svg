<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Fundo: grafite quente (BG_DEEP) -->
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#232326"/>
      <stop offset="100%" stop-color="#121114"/>
    </radialGradient>
    <!-- Cubo: chapa metálica (BEVEL para BG_CARD) -->
    <linearGradient id="cube" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#33333a"/>
      <stop offset="100%" stop-color="#191819"/>
    </linearGradient>
    <!-- Topo do cubo: borda clara (BEVEL) -->
    <linearGradient id="top" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a5a65"/>
      <stop offset="100%" stop-color="#3a3a42"/>
    </linearGradient>
    <!-- Acento âmbar (ACCENT) -->
    <radialGradient id="amber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9440"/>
      <stop offset="100%" stop-color="#f0812a"/>
    </radialGradient>
    <!-- Raio -->
    <linearGradient id="bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0812a"/>
      <stop offset="100%" stop-color="#c25f14"/>
    </linearGradient>
  </defs>

  <!-- Fundo -->
  <rect width="512" height="512" fill="url(#bg)" rx="64"/>

  <!-- Cubo (isométrico simplificado) -->
  <!-- Face esquerda -->
  <polygon points="128,256 256,128 384,256 256,384" fill="url(#cube)"/>
  <!-- Face direita -->
  <polygon points="384,256 256,384 256,128 384,256" fill="#1c1c1f"/>
  <!-- Topo -->
  <polygon points="256,64 384,128 256,192 128,128" fill="url(#top)"/>

  <!-- Cadeado aberto no centro do cubo -->
  <!-- Corpo do cadeado -->
  <rect x="206" y="256" width="100" height="80" rx="8" fill="#33333a" stroke="#5a5a65" stroke-width="3"/>
  <!-- Arco do cadeado (aberto) -->
  <path d="M 226 256 L 226 226 A 30 30 0 0 1 286 226 L 286 256" fill="none" stroke="#f0812a" stroke-width="8" stroke-linecap="round"/>
  <!-- Fenda -->
  <rect x="248" y="286" width="16" height="30" rx="2" fill="#f0812a"/>
  <circle cx="256" cy="300" r="6" fill="#f0812a"/>

  <!-- Raio/flash saindo do cadeado -->
  <polygon points="256,140 236,196 250,196 228,252 282,188 266,188 288,140" fill="url(#bolt)"/>

  <!-- Brilho sutil no topo (VIGNETTE) -->
  <ellipse cx="256" cy="64" rx="180" ry="20" fill="#f0812a" opacity="0.08"/>
</svg>