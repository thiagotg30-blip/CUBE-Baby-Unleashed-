<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <!-- Gradiente metálico do cubo -->
    <linearGradient id="cubeFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a3a42"/>
      <stop offset="50%" stop-color="#232327"/>
      <stop offset="100%" stop-color="#191819"/>
    </linearGradient>
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#54545e"/>
      <stop offset="100%" stop-color="#3a3a42"/>
    </linearGradient>
    <linearGradient id="cubeSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a30"/>
      <stop offset="100%" stop-color="#1a1a1e"/>
    </linearGradient>
    <!-- Gradiente âmbar para texto -->
    <linearGradient id="amberText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9440"/>
      <stop offset="50%" stop-color="#f0812a"/>
      <stop offset="100%" stop-color="#c25f14"/>
    </linearGradient>
    <!-- Gradiente do captador -->
    <linearGradient id="pickup" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1e"/>
      <stop offset="100%" stop-color="#0e0e10"/>
    </linearGradient>
    <!-- Glow do raio -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Sombra do cubo -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Cubo 3D isométrico -->
  <g transform="translate(100, 100)">
    <!-- Face esquerda -->
    <polygon points="-50,0 0,-50 50,0 0,50" fill="url(#cubeFace)" stroke="#4a4a55" stroke-width="1"/>
    <!-- Face direita -->
    <polygon points="50,0 0,50 0,150 50,100" fill="url(#cubeSide)" stroke="#3a3a42" stroke-width="1"/>
    <!-- Face superior -->
    <polygon points="0,-50 50,0 0,50 -50,0" fill="url(#cubeTop)" stroke="#5a5a65" stroke-width="1"/>

    <!-- Captador humbucker no centro da face esquerda -->
    <g transform="translate(-25, -15)">
      <rect x="0" y="0" width="50" height="30" rx="3" fill="url(#pickup)" stroke="#2a2a30" stroke-width="1"/>
      <!-- 6 polos -->
      <circle cx="8" cy="10" r="2.5" fill="#8a8a92"/>
      <circle cx="18" cy="10" r="2.5" fill="#8a8a92"/>
      <circle cx="28" cy="10" r="2.5" fill="#8a8a92"/>
      <circle cx="38" cy="10" r="2.5" fill="#8a8a92"/>
      <circle cx="8" cy="20" r="2.5" fill="#8a8a92"/>
      <circle cx="18" cy="20" r="2.5" fill="#8a8a92"/>
      <circle cx="28" cy="20" r="2.5" fill="#8a8a92"/>
      <circle cx="38" cy="20" r="2.5" fill="#8a8a92"/>
    </g>

    <!-- 6 cordas atravessando o cubo -->
    <g stroke="#c0c0c8" stroke-width="1" opacity="0.9">
      <line x1="-55" y1="-18" x2="55" y2="-18"/>
      <line x1="-55" y1="-12" x2="55" y2="-12"/>
      <line x1="-55" y1="-6" x2="55" y2="-6"/>
      <line x1="-55" y1="0" x2="55" y2="0"/>
      <line x1="-55" y1="6" x2="55" y2="6"/>
      <line x1="-55" y1="12" x2="55" y2="12"/>
    </g>

    <!-- Faíscas nas bordas (efeito "unleashed") -->
    <g filter="url(#glow)">
      <!-- Faísca superior direita -->
      <polygon points="45,-25 50,-35 55,-25" fill="#f0812a" opacity="0.9"/>
      <polygon points="40,-30 45,-40 50,-30" fill="#ff9440" opacity="0.7"/>
      <!-- Faísca inferior esquerda -->
      <polygon points="-45,25 -50,35 -55,25" fill="#f0812a" opacity="0.9"/>
      <polygon points="-40,30 -45,40 -50,30" fill="#ff9440" opacity="0.7"/>
      <!-- Faísca direita -->
      <polygon points="55,5 65,10 55,15" fill="#f0812a" opacity="0.8"/>
      <!-- Faísca esquerda -->
      <polygon points="-55,5 -65,10 -55,15" fill="#f0812a" opacity="0.8"/>
    </g>

    <!-- Brilho no topo -->
    <ellipse cx="0" cy="-52" rx="40" ry="4" fill="#f0812a" opacity="0.15"/>
  </g>

  <!-- Texto: CUBE BABY -->
  <text x="200" y="85" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900" fill="url(#amberText)" letter-spacing="2">
    CUBE BABY
  </text>

  <!-- Texto: UNLEASHED -->
  <text x="200" y="125" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#ece9e3" letter-spacing="6">
    UNLEASHED
  </text>

  <!-- Linha decorativa -->
  <line x1="200" y1="140" x2="450" y2="140" stroke="#f0812a" stroke-width="2" opacity="0.5"/>

  <!-- Subtítulo -->
  <text x="200" y="160" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#8f8b83" letter-spacing="1">
    EDITOR DE TIMBRE · CUVAVE / M-VAVE CUBE BABY
  </text>

  <!-- Pequenos raios decorativos ao redor do texto -->
  <g filter="url(#glow)" opacity="0.6">
    <polygon points="480,60 485,70 490,60" fill="#f0812a"/>
    <polygon points="520,80 525,90 530,80" fill="#f0812a"/>
    <polygon points="560,60 565,70 570,60" fill="#f0812a"/>
  </g>
</svg>